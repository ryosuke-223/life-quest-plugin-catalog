name: Validate plugin catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifests
        run: python3 scripts/validate_catalog.py
      - name: Rebuild catalog and check for changes
        run: |
          python3 scripts/build_catalog.py
          git diff --exit-code -- catalog.json
